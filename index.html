<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  
  <!-- Cache Control to prevent stale versions -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <!-- Favicon for modern browsers -->
  <link rel="icon" type="image/png" sizes="32x32" href="/kmti_logo.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/kmti_logo.png" />
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/kmti_logo.png" />
  <!-- Fallback favicon -->
  <link rel="shortcut icon" href="/kmti_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Preconnect to Cloudflare R2 asset CDN for faster first image load -->
  <link rel="preconnect" href="https://pub-41f5a96a10a946a5ae6457884d5653fd.r2.dev" crossorigin>

  <!-- dns-prefetch for external links (Maps, Facebook, Gmail) -->
  <link rel="dns-prefetch" href="https://maps.app.goo.gl" />
  <link rel="dns-prefetch" href="https://www.facebook.com" />
  <link rel="dns-prefetch" href="https://mail.google.com" />

  <!-- Preload hero background: largest above-the-fold asset, fetched in parallel with JS -->
  <link rel="preload" as="image"
    href="/hero_background/homebg.webp" />

  <!-- Font: only the 3 weights actually used (saves ~60% vs wght@100..900) -->
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Kusakabe &amp; Maeno Tech., Inc.</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
